<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Edmund Nie</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <style>
      body {
        -webkit-text-size-adjust: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        /* very pale pastel yellow (almost-white) */
        background: #fdfd96;
        color: #000080; /* dark text for contrast on light background */
        /* prefer emoji-capable fonts so emojis render correctly */
        font-family: "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji",
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }

      .message {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 27px;
        font-weight: 600;
        width: 85%;
        z-index: 10;
        opacity: 0;
        transition: opacity 1s;
        letter-spacing: 0;
      }

      .question {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        font-weight: 600;
        width: 75%;
        text-align: center;
        color: #fff;
        padding: 20px 10px;
        border-radius: 25px;
        background: linear-gradient(145deg, #1e1e2f, #2a2a3d);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6),
          0 0 20px rgba(255, 100, 200, 0.3), 0 0 40px rgba(100, 150, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.1);
        animation: popupFade 0.5s ease forwards;
        z-index: 10;
      }

      @keyframes popupFade {
        from {
          transform: translate(-50%, -50%) scale(0.7);
          opacity: 0;
        }
        to {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
      }

      .buttons {
        margin-top: 25px;
        display: flex;
        gap: 25px;
        justify-content: center;
      }

      button {
        font-size: 20px;
        padding: 14px 28px;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
      }

      #yesBtn {
        background: linear-gradient(45deg, #ffd54f, #ffb300); /* warm yellow */
        color: #1a1a1a;
        box-shadow: 0 6px 15px rgba(255, 179, 0, 0.25);
      }

      #yesBtn:hover {
        transform: scale(1.08) rotate(-1.5deg);
        box-shadow: 0 8px 22px rgba(255, 179, 0, 0.32);
      }

      #noBtn {
        background: linear-gradient(45deg, #bfe9ff, #9fd6ff); /* pastel blue */
        color: #06283d;
        box-shadow: 0 6px 15px rgba(30, 120, 200, 0.12);
      }

      #noBtn:hover {
        transform: scale(1.08) rotate(1.5deg);
        box-shadow: 0 8px 22px rgba(30, 120, 200, 0.2);
      }

      .buttons {
        margin-top: 20px;
      }

      button {
        padding: 10px 20px;
        font-size: 20px;
        margin: 0 10px;
        cursor: pointer;
      }

      .falling {
        position: absolute;
        /* keep top at 0 and use transform for vertical movement only — avoids layout jumps */
        top: 0;
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 6px;
        overflow: hidden; /* ensure inner img is clipped to rounded corners */
        /* hint the browser we will animate transform for smoother rendering */
        will-change: transform;
        /* default transform keeps pooled elements off-screen until activated */
        transform: translate3d(var(--tx, 0px), -250px, 0);
        backface-visibility: hidden;
        /* animation properties — duration is set inline from JS so we only specify name/timing/fill here */
        animation-name: fall;
        animation-timing-function: linear;
        animation-fill-mode: forwards; /* keep final state until element is removed */
      }

      @keyframes fall {
        /* use translate3d + scale to favor GPU compositing and reduce subpixel wobble;
           scale is driven by --s so we avoid changing layout when size varies */
        from {
          transform: translate3d(var(--tx, 0px), -250px, 0);
        }
        to {
          transform: translate3d(var(--tx, 0px), calc(100vh + 300px), 0);
        }
      }

      .cat-video {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        z-index: 30;
        align-items: center;
        justify-content: center;
      }
      .cat-video video {
        width: 100%;
        height: 100%;
        object-fit: cover; /* fill the viewport while preserving aspect, crop if needed */
      }

      .thankyou {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("assets/cat-flower.jpg") center/cover no-repeat;
        color: white;
        font-size: 26px;
        font-weight: 600;
        align-items: center;
        justify-content: center;
        text-shadow: 2px 2px 6px black;
        z-index: 20;
      }
      /* subtle decorative hearts in background */
      .hearts {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
        /* ensure blobs sit behind content but above background */
      }
      /* soft blob style for background shapes */
      .hearts .heart {
        position: absolute;
        /* size controlled by --heart-size */
        width: var(--heart-size, 20px);
        height: var(--heart-size, 20px);
        background: currentColor;
        transform: rotate(-45deg);
        border-radius: 12px;
        opacity: 0.95;
        will-change: transform, opacity;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.06));
      }
      .hearts .heart::before,
      .hearts .heart::after {
        content: "";
        position: absolute;
        width: var(--heart-size, 20px);
        height: var(--heart-size, 20px);
        background: currentColor;
        border-radius: 50%;
      }
      .hearts .heart::before {
        top: -50%;
        left: 0;
      }
      .hearts .heart::after {
        left: 50%;
        top: 0;
      }

      @keyframes floatHeart {
        0% {
          transform: translateY(0) translateX(0) rotate(-10deg);
          opacity: 0.9;
        }
        50% {
          transform: translateY(-18px) translateX(6px) rotate(-4deg);
          opacity: 0.75;
        }
        100% {
          transform: translateY(0) translateX(0) rotate(-10deg);
          opacity: 0.9;
        }
      }

      .start-btn {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 18px 36px;
        font-size: 18px;
        width: max-content;
        background-color: #ffb6c1;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-weight: 600;
        color: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s, background-color 0.2s;
        z-index: 9999;
      }

      .start-btn:hover {
        background-color: #ff9eb0;
        transform: translate(-50%, -50%) scale(1.05);
      }

      .start-btn.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="message" id="message"></div>
    <button id="startBtn" class="start-btn">Em bấm vào đây để coi nè 🐱</button>
    <div class="hearts" aria-hidden="true"></div>

    <audio id="bgm" preload="auto">
      <source src="assets/bensound-silentmoon.mp3" type="audio/mpeg" />
    </audio>

    <div class="question">
      Em cưới anh nhoe 🧎
      <div class="buttons">
        <button id="yesBtn">Em có</button>
        <button id="noBtn">Em kó</button>
      </div>
    </div>

    <div class="cat-video" id="catVideo">
      <video
        id="introVideo"
        playsinline
        webkit-playsinline
        muted
        preload="auto"
      >
        <source src="assets/cat.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="thankyou">Vậy thì em quay lưng lại đi 💙💛💜</div>

    <script>
      const images = [
        "assets/Image_1.jfif",
        "assets/Image_2.jfif",
        "assets/Image_3.jfif",
        "assets/Image_4.jfif",
        "assets/Image_5.jfif",
        "assets/Image_6.jfif",
        "assets/Image_7.jfif",
        "assets/Image_8.jfif",
        "assets/Image_9.jfif",
        "assets/Image_10.jfif",
        "assets/Image_11.jfif",
        "assets/Image_12.jfif",
        "assets/Image_13.jfif",
        "assets/Image_14.jfif",
        "assets/Image_15.jfif",
        "assets/Image_16.jfif",
        "assets/Image_17.jfif",
        "assets/Image_18.jfif",
        "assets/Image_19.jfif",
        "assets/Image_20.jfif",
        "assets/Image_21.jfif",
        "assets/Image_22.jfif",
        "assets/Image_23.jfif",
        "assets/Image_24.jfif",
        "assets/Image_25.jfif",
        "assets/Image_26.jfif",
        "assets/Image_27.jfif",
        "assets/Image_28.jfif",
        "assets/Image_29.jfif",
        "assets/Image_30.jfif",
        "assets/Image.jfif",
      ];

      const numCols = 5; // chia màn hình thành 8 cột
      let colWidth = window.innerWidth / numCols;
      // recalc on resize
      window.addEventListener("resize", () => {
        colWidth = window.innerWidth / numCols;
      });
      const lastSpawnTime = new Array(numCols).fill(0);
      const minInterval = 4000; // ms, khoảng cách tối thiểu giữa 2 hình cùng 1 cột
      const fallDuration = 6000; // ms, tốc độ rơi đồng nhất

      // preload images to avoid decoding work at spawn time
      // try to use createImageBitmap (best) and fall back to Image elements
      const bitmaps = [];
      const preloaded = images.map((src) => {
        const i = new Image();
        i.src = src;
        i.decoding = "async";
        console.log("preloaded", src);

        return i;
      });
      // target max bitmap size can be tuned; reduce on mobile
      let targetMaxBitmapSize = 256; // px default
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) targetMaxBitmapSize = 140;
      // loading / readiness tracking
      let createdCount = 0;
      const totalImages = preloaded.length;
      // threshold: start when either X bitmaps ready or all images done
      const readyThreshold = Math.min(
        totalImages,
        Math.max(6, Math.floor(totalImages * 0.5))
      );
      let assetsReady = false;

      const useCanvasRenderer = !!window.createImageBitmap;
      if (useCanvasRenderer) {
        // queued, downscaled ImageBitmap creation to avoid GPU upload spikes
        // targetMaxBitmapSize should match or slightly exceed maximum particle size
        const targetMaxBitmapSize = 256; // px
        const bitmapQueue = [];
        let creatingBitmap = false;

        function createDownscaledBitmap(img) {
          // prefer native resizing in createImageBitmap if supported
          if (typeof createImageBitmap === "function") {
            try {
              const w = Math.min(
                targetMaxBitmapSize,
                img.naturalWidth || img.width
              );
              const h = Math.min(
                targetMaxBitmapSize,
                img.naturalHeight || img.height
              );
              // try with resize options (may throw if not supported)
              return createImageBitmap(img, {
                resizeWidth: w,
                resizeHeight: h,
                resizeQuality: "high",
              });
            } catch (e) {
              console.log(e);

              // fallback to drawing into an offscreen canvas below
            }
          }
          // fallback path: draw to an offscreen canvas then createImageBitmap (or return canvas)
          return new Promise((resolve, reject) => {
            try {
              const ow = Math.min(
                targetMaxBitmapSize,
                img.naturalWidth || img.width
              );
              const oh = Math.min(
                targetMaxBitmapSize,
                img.naturalHeight || img.height
              );
              const c = document.createElement("canvas");
              c.width = ow;
              c.height = oh;
              const cctx = c.getContext("2d");
              // draw image scaled to target size
              cctx.drawImage(img, 0, 0, ow, oh);
              // use createImageBitmap from canvas if available, else resolve with canvas as fallback
              if (typeof createImageBitmap === "function") {
                createImageBitmap(c)
                  .then(resolve)
                  .catch((e) => {
                    console.log(e);
                    resolve(c);
                  });
              } else {
                resolve(c);
              }
            } catch (err) {
              console.log(e);
              reject(err);
            }
          });
        }

        function processQueue() {
          if (creatingBitmap) return;
          console.log("processQueue", bitmapQueue);
          const job = bitmapQueue.shift();
          if (!job) return;
          creatingBitmap = true;
          createDownscaledBitmap(job.img)
            .then((bmpOrCanvas) => {
              // store either ImageBitmap or canvas (drawImage accepts both)
              bitmaps.push(bmpOrCanvas);
              createdCount++;
              // when enough assets are ready, mark ready and start spawning
              if (!assetsReady && createdCount >= readyThreshold) {
                assetsReady = true;
                startSpawning();
              }
            })
            .catch((e) => {
              // ignore failures
              console.log(e);
            })
            .finally(() => {
              creatingBitmap = false;
              // schedule next creation a bit later to avoid burst
              setTimeout(processQueue, 60);
            });
        }

        // enqueue create jobs when images load (but don't create immediately all at once)
        preloaded.forEach((img) => {
          img._loaded = false;
          img.onload = () => {
            img._loaded = true;
            console.log("bitmapQueue", img);
            bitmapQueue.push({ img });
            // try to kick off one job
            setTimeout(processQueue, 0);
          };
          img.onerror = () => {
            img._loaded = true;
            // count as processed so failures don't stall readiness
            createdCount++;
            if (!assetsReady && createdCount >= readyThreshold) {
              assetsReady = true;
              startSpawning();
            }
          };
        });
        // Loading overlay
        const loadingOverlay = document.createElement("div");
        loadingOverlay.style.position = "fixed";
        loadingOverlay.style.left = "0";
        loadingOverlay.style.top = "0";
        loadingOverlay.style.width = "100%";
        loadingOverlay.style.height = "100%";
        loadingOverlay.style.display = "flex";
        loadingOverlay.style.alignItems = "center";
        loadingOverlay.style.justifyContent = "center";
        loadingOverlay.style.background = "#fdfd96";
        loadingOverlay.style.zIndex = "9998";
        loadingOverlay.style.color = "#000080";
        loadingOverlay.style.fontSize = "20px";
        loadingOverlay.style.fontWeight = "600";
        loadingOverlay.innerText = "Em pé đợi một chút nha...🐱🐱🐱";
        document.body.appendChild(loadingOverlay);
        // fail-safe: start spawning after timeout even if not all assets ready
        const startFailTimeout = setTimeout(() => {
          if (!assetsReady) {
            assetsReady = true;
            startSpawning();
          }
        }, 30000);
        function startSpawning() {
          // remove overlay
          try {
            loadingOverlay.remove();
          } catch (e) {}
          clearTimeout(startFailTimeout);
          // abort any remaining preloaded image requests to stop browser loading indicator
          try {
            preloaded.forEach((img) => {
              if (!img._loaded && img.src) {
                img.onload = null;
                img.onerror = null;
                try {
                  img.src = "";
                } catch (e) {}
              }
            });
          } catch (e) {}
          // begin spawn scheduler immediately if not already started
          scheduleNextSpawn(0);

          const startBtn = document.getElementById("startBtn");
          startBtn.classList.remove("hidden");
        }
      }

      // Canvas renderer setup (used when createImageBitmap is available)
      let canvas, ctx, particles;
      if (useCanvasRenderer) {
        canvas = document.createElement("canvas");
        canvas.style.position = "fixed";
        canvas.style.left = "0";
        canvas.style.top = "0";
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.zIndex = "2";
        canvas.style.pointerEvents = "none";
        document.body.appendChild(canvas);
        ctx = canvas.getContext("2d");
        function resizeCanvas() {
          // cap DPR to 1 to avoid huge textures which can cause driver stalls
          const dpr = Math.min(1, window.devicePixelRatio || 1);
          canvas.width = Math.round(window.innerWidth * dpr);
          canvas.height = Math.round(window.innerHeight * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        particles = [];

        // render loop for canvas particles
        (function renderLoop() {
          if (!ctx) return requestAnimationFrame(renderLoop);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const now = performance.now();
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            const t = (now - p.start) / p.dur;
            if (t >= 1) {
              particles.splice(i, 1);
              continue;
            }
            const y = p.startY + (p.endY - p.startY) * t;
            const s = p.size;
            // draw centered using absolute size (no scaling)
            const w = s;
            const h = s;
            ctx.save();
            ctx.translate(p.x + w / 2, y + h / 2);
            ctx.rotate(p.rotate);
            ctx.globalAlpha = p.alpha;
            // preserve aspect ratio and center-crop the bitmap into the target square (object-fit: cover)
            const src = p.bitmap;
            let sw = src.width || src.videoWidth || src.naturalWidth || w;
            let sh = src.height || src.videoHeight || src.naturalHeight || h;
            // compute scale to cover the square
            const scale = Math.max(w / sw, h / sh);
            const dw = sw * scale;
            const dh = sh * scale;
            // compute source crop in source-space
            const sx = Math.max(0, (dw - w) / 2 / scale);
            const sy = Math.max(0, (dh - h) / 2 / scale);
            const ssw = Math.max(1, sw - sx * 2);
            const ssh = Math.max(1, sh - sy * 2);
            // rounded-rect clipping so canvas particles have rounded corners
            const radius = Math.min(12, Math.round(Math.min(w, h) * 0.08));
            ctx.beginPath();
            const rw = -w / 2;
            const rh = -h / 2;
            ctx.moveTo(rw + radius, rh);
            ctx.lineTo(rw + w - radius, rh);
            ctx.quadraticCurveTo(rw + w, rh, rw + w, rh + radius);
            ctx.lineTo(rw + w, rh + h - radius);
            ctx.quadraticCurveTo(rw + w, rh + h, rw + w - radius, rh + h);
            ctx.lineTo(rw + radius, rh + h);
            ctx.quadraticCurveTo(rw, rh + h, rw, rh + h - radius);
            ctx.lineTo(rw, rh + radius);
            ctx.quadraticCurveTo(rw, rh, rw + radius, rh);
            ctx.closePath();
            ctx.clip();
            // drawImage(source, sx, sy, ssw, ssh, dx, dy, dw, dh)
            ctx.drawImage(src, sx, sy, ssw, ssh, -w / 2, -h / 2, w, h);
            ctx.restore();
          }
          requestAnimationFrame(renderLoop);
        })();
      }

      // cap concurrent falling images to avoid spikes
      let activeCount = 0;
      let maxActive = 9; // reduce default concurrency further (mutable for auto-throttle)

      // create a pool of reusable falling elements to avoid allocations/GC spikes
      const pool = [];
      for (let i = 0; i < maxActive; i++) {
        const wrapper = document.createElement("div");
        wrapper.className = "falling";
        wrapper.style.visibility = "hidden";
        wrapper.dataset.inUse = "0";
        // inner img uses a preloaded source (we'll swap src when activated)
        const imgEl = document.createElement("img");
        imgEl.style.width = "100%";
        imgEl.style.height = "100%";
        imgEl.style.objectFit = "cover";
        imgEl.draggable = false;
        wrapper.appendChild(imgEl);
        // when animation ends, mark free
        wrapper.addEventListener("animationend", () => {
          wrapper.style.visibility = "hidden";
          wrapper.dataset.inUse = "0";
          activeCount = Math.max(0, activeCount - 1);
          // clear inline animation so next activation can restart cleanly
          wrapper.style.animation = "none";
        });
        document.body.appendChild(wrapper);
        pool.push(wrapper);
      }

      function getFreeFromPool() {
        for (const p of pool) if (p.dataset.inUse === "0") return p;
        return null;
      }

      function spawnImage() {
        let col;
        let now = Date.now();

        // tìm cột hợp lệ (chưa spawn gần đây)
        let attempts = 0;
        const maxAttempts = 12;
        do {
          col = Math.floor(Math.random() * numCols);
          attempts++;
          if (attempts > maxAttempts) break; // fail-safe
          // ensure last spawn in this column isn't too recent
          if (now - lastSpawnTime[col] < minInterval) continue;
          // check horizontal proximity against existing canvas particles
          const colX = Math.round(col * colWidth + colWidth / 2);
          let tooClose = false;
          for (const p of particles) {
            const pxCenter = p.x + p.size / 2;
            if (Math.abs(pxCenter - colX) < Math.max(80, p.size * 0.8)) {
              tooClose = true;
              break;
            }
          }
          if (tooClose) continue;
          // check active DOM wrappers positions
          for (const w of pool) {
            if (w.dataset.inUse === "1") {
              const tx = parseInt(w.style.getPropertyValue("--tx")) || 0;
              const wCenter = tx + (parseInt(w.style.width) || 200) / 2;
              if (Math.abs(wCenter - colX) < 160) {
                tooClose = true;
                break;
              }
            }
          }
          if (tooClose) continue;
          break;
        } while (true);

        // respect max concurrent falling images
        if (activeCount >= maxActive) return;
        lastSpawnTime[col] = now;

        const wrapper = getFreeFromPool();
        if (!wrapper) return; // pool exhausted

        // choose image src (preloaded) and either push a canvas particle or use DOM fallback
        const idx = Math.floor(Math.random() * preloaded.length);
        const base = preloaded[idx];

        // compute base size and scaled size (use for both canvas and DOM)
        const size = 120;
        const x = Math.round(col * colWidth + colWidth / 2 - size / 2);
        const dur = fallDuration + Math.floor(Math.random() * 1200) - 600;

        if (useCanvasRenderer && bitmaps.length > 0) {
          // pick a bitmap if available
          const bmp = bitmaps[idx % bitmaps.length] || bitmaps[0];
          const startY = -250;
          const endY = window.innerHeight + 300;
          // limit particles to avoid overload
          if (particles.length >= Math.max(6, Math.floor(maxActive * 1.5)))
            return;
          particles.push({
            bitmap: bmp,
            start: performance.now(),
            dur,
            startY,
            endY,
            x,
            size,
            alpha: 1,
            rotate: (Math.random() - 0.5) * 0.3,
          });
          return;
        }

        // DOM fallback: assign to wrapper's inner img
        const imgEl = wrapper.querySelector("img");
        imgEl.src = base.src;

        imgEl.style.borderRadius = 10 + "px";
        // position via CSS variable and set absolute size (no scale to avoid distortion)
        wrapper.style.width = size + "px";
        wrapper.style.height = size + "px";
        wrapper.style.setProperty("--tx", x + "px");
        wrapper.style.animation = "none";

        // mark in-use
        wrapper.dataset.inUse = "1";
        wrapper.style.willChange = "transform";
        activeCount++;

        // start animation using Web Animations API for finer control
        wrapper.style.visibility = "visible";
        const startY = -250;
        const endY = window.innerHeight + 300;
        // ensure any previous animation is cancelled
        if (wrapper._anim) wrapper._anim.cancel();
        wrapper._anim = wrapper.animate(
          [
            { transform: `translate3d(var(--tx, 0px), ${startY}px, 0)` },
            { transform: `translate3d(var(--tx, 0px), ${endY}px, 0)` },
          ],
          {
            duration: dur,
            easing: "linear",
            fill: "forwards",
          }
        );
        wrapper._anim.onfinish = () => {
          wrapper.style.visibility = "hidden";
          wrapper.dataset.inUse = "0";
          activeCount = Math.max(0, activeCount - 1);
          wrapper._anim = null;
        };
      }

      // free bitmaps on unload to release GPU memory
      window.addEventListener("unload", () => {
        if (bitmaps && bitmaps.length) {
          for (const b of bitmaps)
            try {
              b.close && b.close();
            } catch (e) {}
        }
      });

      // adaptive spawn scheduler using timeouts so we can pause/reschedule quickly
      let spawnInterval = 1500;
      let spawnTimerId = null;
      let pausedUntil = 0;
      let sizeScale = 1.0; // scales image size when throttled

      function scheduleNextSpawn(delay) {
        if (spawnTimerId) clearTimeout(spawnTimerId);
        spawnTimerId = setTimeout(() => {
          const now = performance.now();
          if (now < pausedUntil) {
            scheduleNextSpawn(Math.max(200, pausedUntil - now));
            return;
          }
          if (
            !(activeCount > Math.floor(maxActive * 0.7) && Math.random() < 0.75)
          ) {
            spawnImage();
          }
          scheduleNextSpawn(spawnInterval);
        }, delay || spawnInterval);
      }

      // lightweight profiler + auto-throttle
      const stats = { fps: 60, active: 0, longTask: 0 };
      let lastTime = performance.now();
      let frames = 0;
      function rafTick(now) {
        frames++;
        const dt = now - lastTime;
        if (dt >= 1000) {
          stats.fps = Math.round((frames * 1000) / dt);
          frames = 0;
          lastTime = now;
          stats.active = activeCount;
          // auto-throttle behavior (more aggressive):
          if (stats.fps < 35 && stats.fps >= 25) {
            // mild throttle: reduce concurrency slightly and increase interval
            maxActive = Math.max(6, Math.floor(maxActive * 0.85));
            spawnInterval = Math.min(2200, Math.floor(spawnInterval * 1.15));
            sizeScale = Math.max(0.85, sizeScale * 0.95);
            scheduleNextSpawn(spawnInterval);
          } else if (stats.fps < 25 && stats.fps >= 15) {
            // stronger throttle
            maxActive = Math.max(4, Math.floor(maxActive * 0.8));
            spawnInterval = Math.min(2600, Math.floor(spawnInterval * 1.25));
            sizeScale = Math.max(0.7, sizeScale * 0.85);
            // pause briefly to let system recover
            pausedUntil = performance.now() + 800;
            scheduleNextSpawn(800);
          } else if (stats.fps < 15) {
            // emergency: pause spawning for a short window and shrink sizes
            pausedUntil = performance.now() + 1400;
            maxActive = Math.max(3, Math.floor(maxActive * 0.6));
            spawnInterval = Math.min(3000, Math.floor(spawnInterval * 1.4));
            sizeScale = Math.max(0.5, sizeScale * 0.7);
            scheduleNextSpawn(1400);
          } else {
            // when healthy, slowly recover parameters toward defaults
            maxActive = Math.min(12, Math.ceil(maxActive * 1.02));
            spawnInterval = Math.max(1200, Math.floor(spawnInterval * 0.98));
            sizeScale = Math.min(1.0, sizeScale * 1.02);
          }
        }
        requestAnimationFrame(rafTick);
      }
      requestAnimationFrame(rafTick);

      // long task detection (optional)
      try {
        const obs = new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (entry.duration > 50)
              stats.longTask = Math.round(entry.duration);
          }
        });
        obs.observe({ entryTypes: ["longtask"] });
      } catch (e) {
        // ignore if not supported
      }

      // debug overlay removed for production / smoother visuals

      /* Thông điệp lần lượt */
      const messages = [
        "He lô em, là anh quàng từ meo của em đây 🤴",
        "Trước đây, lúc chưa gặp em",
        "Cuộc đời anh chỉ toàn là drama và tiêu cực",
        "Từ ngày gặp được em, được trải nghiệm và đi nhiều nơi cùng em",
        "Các bức hình em đang thấy là những khoảnh khắc anh và em đã cùng nhau trải qua",
        "Đoạn đường mình đi cũng đủ dài rồi, nhưng anh vẫn đang nợ em một happy ending như trong phim hàn quắc",
        "Anh biết để em có cảm giác mình phải đi hối anh cầu hôn là không đúng",
        "Anh pé xin lỗi vì đã để em phải chờ đợi",
        "Thật ra lúc đó anh chỉ muốn chắc chắn rằng anh đã khắc phục đc mọi vấn đề trong mối quan hệ của tụi mình",
        "Và đã chuẩn bị mọi thứ thật tốt cho bước ngoặc quan trọng này",
        "Nhưng lúc em đi tìm hiểu về tuổi cưới, cũng là lúc anh nhận ra mình đã nhận ra...",
        "Mình đã ích kỉ",
        "Đã để em phải chờ đợi rồi",
        "Anh pé xin lỗi vì điều đó",
        "Anh có một câu hỏi muốn hỏi em",
        "Em sẽ cho anh cơ hội bù đắp và chăm sóc em cả đời chớ? 👰",
      ];
      let msgIndex = 0;
      const msgEl = document.getElementById("message");

      const audio = document.getElementById("bgm");
      const startBtn = document.getElementById("startBtn");
      startBtn.classList.add("hidden");

      startBtn.addEventListener("click", () => {
        startBtn.classList.add("hidden");

        // scheduleNextSpawn(0);

        audio.currentTime = 0;
        audio
          .play()
          .then(() => {
            document.getElementById("message").textContent = "Anh yêu em ❤️";
          })
          .catch((err) => {
            console.log("Không thể phát nhạc:", err);
          });

        // requestAnimationFrame(rafTick);
        setTimeout(showNextMessage, 5000);
      });

      function showNextMessage() {
        if (msgIndex < messages.length) {
          msgEl.textContent = messages[msgIndex];
          msgEl.style.opacity = 1;
          setTimeout(() => {
            msgEl.style.opacity = 0;
            msgIndex++;
            setTimeout(showNextMessage, 6000);
          }, 6000);
        } else {
          document.querySelector(".question").style.display = "block";
        }
      }
      // setTimeout(showNextMessage, 7000);

      /* Nút */
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const thankyou = document.querySelector(".thankyou");
      const catVideo = document.getElementById("catVideo");
      // the video element id in the HTML is "introVideo"; reference it here
      const catClip = document.getElementById("introVideo");

      yesBtn.onclick = () => {
        document.querySelector(".question").style.display = "none";
        catVideo.style.display = "flex"; // show clip mèo
        catClip.muted = false; // bật tiếng
        catClip.currentTime = 0; // tua lại từ đầu
        catClip.play();
      };

      // khi clip mèo kết thúc -> hiện thankyou
      catClip.onended = () => {
        catVideo.style.display = "none";
        thankyou.style.display = "flex";
      };

      noBtn.onclick = () => {
        document.querySelector(".question").style.display = "none";
        catVideo.style.display = "flex"; // show clip mèo
        catClip.muted = false; // bật tiếng
        catClip.currentTime = 0; // tua lại từ đầu
        catClip.play();
      };
      // decorative background blobs (responsive, non-interactive)
      (function createBackgroundBlobs() {
        const container = document.querySelector(".hearts");
        if (!container) return;

        function build() {
          container.textContent = ""; // clear
          const vw = Math.max(320, window.innerWidth);
          // on small screens, use fewer but larger blobs
          const isNarrow = vw < 420;
          // requested palette: purple, blue, pale pink
          const colors = ["#d6b3ff", "#bfe9ff", "#ffe6f2"];
          // create more hearts: higher minimums and denser distribution
          const count = isNarrow
            ? Math.max(6, Math.floor(vw / 160))
            : Math.max(10, Math.floor(vw / 120));

          // place hearts with simple rejection sampling to avoid overlaps
          const placed = [];
          const vh = Math.max(480, window.innerHeight);
          const minAttempts = 12;
          for (let i = 0; i < count; i++) {
            const b = document.createElement("div");
            b.className = "heart";
            // size: larger on narrow screens
            const base = isNarrow ? 24 : 20;
            const randRange = isNarrow ? 64 : 72;
            const size = base + Math.round(Math.random() * randRange);
            b.style.setProperty("--heart-size", size + "px");
            // choose position but avoid placing too close to existing hearts
            let attempts = 0;
            let leftPct, topPct, pxX, pxY, ok;
            const minGap = Math.max(48, Math.round(size * 0.6));
            do {
              leftPct = Math.random() * 92;
              topPct = Math.random() * 88;
              pxX = (leftPct / 100) * vw;
              pxY = (topPct / 100) * vh;
              ok = true;
              for (const p of placed) {
                const dx = pxX - p.x;
                const dy = pxY - p.y;
                if (
                  Math.hypot(dx, dy) < Math.max(minGap, (size + p.size) * 0.45)
                ) {
                  ok = false;
                  break;
                }
              }
              attempts++;
            } while (!ok && attempts < minAttempts);
            if (!ok) {
              // couldn't find a non-overlapping spot; still place it but spread slightly
              leftPct = Math.random() * 92;
              topPct = Math.random() * 88;
              pxX = (leftPct / 100) * vw;
              pxY = (topPct / 100) * vh;
            }
            placed.push({ x: pxX, y: pxY, size });
            b.style.left = Math.round(leftPct) + "%";
            b.style.top = Math.round(topPct) + "%";
            b.style.color = colors[Math.floor(Math.random() * colors.length)];
            const dur = 6 + Math.random() * 8;
            const delay = Math.random() * 3;
            b.style.animation = `floatHeart ${dur}s ease-in-out ${delay}s infinite`;
            container.appendChild(b);
          }
        }

        build();
        // debounce resize
        let rt;
        window.addEventListener("resize", () => {
          clearTimeout(rt);
          rt = setTimeout(build, 200);
        });
      })();
    </script>
  </body>
</html>
